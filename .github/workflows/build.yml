name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NGSPICE_VERSION: "47"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            qt_arch: win64_msvc2022_64
            qt_version: "6.8.3"
            artifact: Voltix-Windows
          - name: Linux
            os: ubuntu-22.04
            qt_arch: ""
            qt_version: "6.8.3"
            artifact: Voltix-Linux
          - name: macOS
            os: macos-latest
            qt_arch: ""
            qt_version: "6.9.3"
            artifact: Voltix-macOS

    steps:
      - uses: actions/checkout@v4

      - name: Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt_version }}
          arch: ${{ matrix.qt_arch }}
          cache: true

      - name: Dépendances Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-xinerama0 libfuse2 bison flex imagemagick

      # ---------- ngspice (mis en cache) ----------
      - name: ngspice (cache)
        id: ngcache
        uses: actions/cache@v4
        with:
          path: third_party/ngspice
          key: ngspice-${{ env.NGSPICE_VERSION }}-${{ runner.os }}-${{ runner.arch }}-v2

      - name: ngspice (Windows, binaires officiels)
        if: runner.os == 'Windows' && steps.ngcache.outputs.cache-hit != 'true'
        shell: bash
        env:
          EXPECTED_SHA256: ""   # à renseigner depuis les journaux d'un build réussi
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o ngspice.7z \
            "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/${NGSPICE_VERSION}/ngspice-${NGSPICE_VERSION}_64.7z/download"
          sha256sum ngspice.7z
          if [ -n "$EXPECTED_SHA256" ]; then echo "$EXPECTED_SHA256  ngspice.7z" | sha256sum -c -; fi
          7z x ngspice.7z -ongspice_tmp -y > /dev/null
          exe=$(find ngspice_tmp -name ngspice_con.exe | head -1)
          root=$(dirname "$(dirname "$exe")")
          mkdir -p third_party
          cp -r "$root" third_party/ngspice

      - name: ngspice (Linux et macOS, compilation depuis les sources)
        if: runner.os != 'Windows' && steps.ngcache.outputs.cache-hit != 'true'
        shell: bash
        env:
          EXPECTED_SHA256: ""   # à renseigner depuis les journaux d'un build réussi
        run: |
          set -euo pipefail
          curl -fL --retry 3 -o ngspice.tar.gz \
            "https://sourceforge.net/projects/ngspice/files/ng-spice-rework/${NGSPICE_VERSION}/ngspice-${NGSPICE_VERSION}.tar.gz/download"
          shasum -a 256 ngspice.tar.gz
          if [ -n "$EXPECTED_SHA256" ]; then echo "$EXPECTED_SHA256  ngspice.tar.gz" | shasum -a 256 -c -; fi
          tar xzf ngspice.tar.gz
          cd "ngspice-${NGSPICE_VERSION}"
          ./configure --prefix="$GITHUB_WORKSPACE/third_party/ngspice" \
            --with-x=no --with-readline=no --disable-debug --disable-openmp
          make -j4
          make install
          cp COPYING "$GITHUB_WORKSPACE/third_party/ngspice/COPYING"

      # ---------- compilation ----------
      - name: Configuration et compilation
        shell: bash
        run: |
          VER="0.0.0-dev"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "Version : $VER"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVOLTIX_VERSION="$VER"
          cmake --build build --config Release --parallel

      # ---------- Windows ----------
      - name: Paquet Windows (zip portable)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/dist"
          mkdir -p package
          (cd dist && 7z a ../package/Voltix-Windows.zip . > /dev/null)

      - name: Installateur Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          $ver = "0.0.0"
          if ($env:GITHUB_REF_TYPE -eq "tag") { $ver = $env:GITHUB_REF_NAME.TrimStart("v") }
          & $iscc "/DMyAppVersion=$ver" "/DSourceDir=$env:GITHUB_WORKSPACE\dist" "/DOutputDir=$env:GITHUB_WORKSPACE\package" "packaging\voltix.iss"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ---------- macOS ----------
      - name: Paquet macOS
        if: runner.os == 'macOS'
        run: |
          cmake --install build --config Release --prefix "$GITHUB_WORKSPACE/dist"
          codesign --force --deep --sign - dist/Voltix.app
          mkdir -p package
          hdiutil create -volname Voltix -srcfolder dist/Voltix.app -ov -format UDZO package/Voltix-macOS.dmg

      # ---------- Linux (AppImage) ----------
      - name: Paquet Linux
        if: runner.os == 'Linux'
        run: |
          printf '[Desktop Entry]\nType=Application\nName=Voltix\nComment=Editeur de schemas electroniques avec simulation\nExec=Voltix\nIcon=voltix\nCategories=Engineering;Electronics;\nMimeType=application/x-voltix;\n' > voltix.desktop
          [ -f packaging/voltix.png ] || convert -size 256x256 xc:'#1e6fd9' packaging/voltix.png
          cmake --install build --prefix AppDir/usr
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:${LD_LIBRARY_PATH:-}"
          export VERSION="${GITHUB_REF_NAME}"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt \
            -e AppDir/usr/bin/Voltix -d voltix.desktop -i packaging/voltix.png \
            --output appimage
          mkdir -p package
          mv Voltix*.AppImage package/Voltix-x86_64.AppImage

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package/*

  release:
    name: Publier la version
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true